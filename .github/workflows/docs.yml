name: docs

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -c constraints/docs.txt mkdocs mkdocs-material
          python -m pip install -e .
      - name: Generated pages are current
        run: python tools/render_rulings.py --check
      - name: Build and deploy
        run: mkdocs gh-deploy --force
