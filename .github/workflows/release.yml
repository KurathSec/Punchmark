name: release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Version gates
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python -c "exec(open('src/punchmark/_version.py').read()); print(__version__)")
          test "$TAG" = "$PKG" || { echo "tag $TAG != _version.py $PKG"; exit 1; }
          NEWEST=$(grep -m1 '^## ' CHANGELOG.md | sed 's/^## //')
          test "$NEWEST" = "$TAG" \
            || { echo "newest CHANGELOG heading is '$NEWEST', expected '$TAG'"; exit 1; }
      - name: Build
        # --no-isolation so the PINNED backend from constraints/build.txt is the
        # one that builds the artifacts; isolated builds would resolve hatchling
        # fresh and defeat the pin.
        run: |
          python -m pip install -c constraints/build.txt build hatchling
          python -m build --no-isolation
      - name: Sdist policy -- these never ship
        run: |
          TARBALL=$(ls dist/*.tar.gz)
          for BAD in .github/ CLAUDE.md site/ scratch/ paper/ calibration/ validation/; do
            if tar -tzf "$TARBALL" | grep -q "/$BAD"; then
              echo "sdist contains forbidden path: $BAD"; exit 1
            fi
          done
      - name: Wheel smoke -- offline roundtrip from the built artifact
        # unshare -rn drops the network namespace: the installed wheel must
        # complete the whole roundtrip, certify included, with no network.
        run: |
          python -m venv /tmp/smokevenv
          /tmp/smokevenv/bin/pip install dist/*.whl
          # Same isolation fallback as ci.yml: unprivileged user namespaces are
          # denied on ubuntu-24.04 runners; a privileged netns needs no uid map.
          # All paths below are absolute, so sudo's PATH reset does not matter.
          if unshare -rn true 2>/dev/null; then
            ISOLATE="unshare -rn"
          elif sudo -n unshare -n true 2>/dev/null; then
            ISOLATE="sudo -n unshare -n"
          else
            echo "::error::no network isolation available on this runner"
            exit 1
          fi
          echo "network isolation: $ISOLATE"
          $ISOLATE bash -e -c '
            /tmp/smokevenv/bin/punchmark env
            /tmp/smokevenv/bin/punchmark spec list > /dev/null
            /tmp/smokevenv/bin/punchmark synth --out /tmp/sm --routes 2 --clusters 8 --k 2 --separation 0.7 --seed 2
            /tmp/smokevenv/bin/punchmark fit /tmp/sm/synthtask__*.jsonl.gz \
              --candidates synth/route-a,synth/route-b \
              --out /tmp/sm/model.json --m-grid 20 --far-grid 0.05,0.1 \
              --n-null 120 --n-splice 30 --min-clusters 3
            /tmp/smokevenv/bin/punchmark score /tmp/sm/synthtask__synth-route-a.jsonl.gz \
              --model /tmp/sm/model.json --rulings /tmp/sm/r.jsonl --far 0.05
            RID=$(/tmp/smokevenv/bin/python -c "import json;print(json.loads(open(\"/tmp/sm/r.jsonl\").readline())[\"ruling_id\"])")
            /tmp/smokevenv/bin/punchmark certify --ruling "$RID" --rulings /tmp/sm/r.jsonl
            /tmp/smokevenv/bin/punchmark gate /tmp/sm/model.json --baseline /tmp/sm/b.json --write-baseline
            /tmp/smokevenv/bin/punchmark gate /tmp/sm/model.json --baseline /tmp/sm/b.json --require-chain-valid --rulings /tmp/sm/r.jsonl
          '
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
