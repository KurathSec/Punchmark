[[ruling]]
id = "PMK-COR-001"
title = "The manifest is the corpus identity"
text = """The calibration corpus a ruling cites is identified by the content hash of its
MANIFEST -- the pinned checkout commit plus per-source sha256 -- not by shipped bytes. A
manifest hash is exactly as binding over pins as over copies: if any pinned source
changes, the manifest changes, and every ruling id downstream changes with it."""

[[ruling]]
id = "PMK-COR-002"
title = "The shipped corpus mode is manifest + local rebuild"
text = """The reference calibration corpus ships no completion text. Re-publishing the
upstream benchmark's committed private-test completions in a second repository would be a
second, separate disclosure decision, and punchmark declines to take it: the manifest
pins the upstream commit and hashes, and 'corpus rebuild --source <checkout>' verifies a
local checkout byte-for-byte. raw and features modes exist in code and are exercised
synthetically so the machinery is proven; neither is used for the reference corpus."""
